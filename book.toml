[book]
title = "Agent RL Explained: A Beginner's Handbook"
authors = ["Siwen Yu"]
language = "en"
src = "src"
description = "A plain-English handbook for Agent RL: RL basics, alignment algorithms, reward design, credit assignment, training frameworks, evaluation, and skill self-evolution"

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
smart-punctuation = false
# MathJax is vendored in mathjax/ and loaded by additional-js below. mdBook's built-in
# mathjax-support injects a MathJax 2.7 script from cdnjs, which renders nothing when
# that CDN is unreachable or blocked by a content-security-policy. Keep it off.
mathjax-support = false
additional-js = ["mathjax/config.js", "mathjax/tex-svg.js"]
additional-css = ["css/figures.css"]
# GitHub Pages. The custom domain yusiwen.cn is set on the *user* site (yusiwen.github.io),
# and GitHub serves every project site of that account under it, so this book is published at
# https://yusiwen.cn/agent-rl/ with no further configuration.
# Do NOT set `cname` here: it writes a CNAME file that claims the apex domain for this
# repository, which conflicts with the user site. For a dedicated subdomain instead, set
#   cname = "book.yusiwen.cn"
# and add a DNS CNAME record pointing there to yusiwen.github.io.
# site-url is what makes the 404 page and its assets resolve when the site is served from a
# subdirectory; keep it in step with the repository name.
site-url = "/agent-rl/"
no-section-label = false

[output.html.fold]
enable = true
level = 0

[output.html.search]
limit-results = 30
expand = true

[output.html.print]
enable = true
