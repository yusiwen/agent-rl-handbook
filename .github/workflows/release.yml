name: Release the book

# A tag starting with "v" is a release: run the same gate as a normal push, publish the site, and
# open a GitHub Release whose notes are generated from the commits since the previous tag.
#
# Why both workflows exist: a push to main publishes the current text, so the site is always the
# latest build and a page that breaks the rules never reaches it (scripts/verify.sh runs first).
# A tag publishes the same content and adds the part a branch cannot: an immutable marker, and a
# Release page that says what changed. The landing page line "This build: v0.1 ..." is expected to
# match a tag here.
#
# The tag has to sit on main: a site that silently rolls back to an old commit because someone
# tagged one is worse than a failed workflow, so the job refuses and says why.
#
# Retry a failed run without moving the tag:
#     gh workflow run release.yml --ref v0.1

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# The same group as pages.yml, so a release and a normal publish never deploy at the same time,
# and an in-flight deployment is never cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: The tag must be on main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main. The site publishes main's line of history; cut the tag at the tip of main."
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME is on main"

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Verify and build
        run: nix develop --command bash scripts/verify.sh

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  release:
    needs: deploy
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # v0.x is an early access line: the Release is marked as a pre-release until the book stops
      # calling itself one. Notes come from the commits since the previous tag, not from a file
      # somebody has to remember to update.
      - name: Create the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--title "Agent RL Explained - $GITHUB_REF_NAME" --verify-tag --generate-notes)
          case "$GITHUB_REF_NAME" in
            v0.*) args+=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" "${args[@]}"
