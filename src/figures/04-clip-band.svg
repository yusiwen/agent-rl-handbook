<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 320" width="100%" style="max-width:100%;height:auto"
     role="img" aria-label="The clipped objective for one action as the policy moves: inside the band around a ratio of one the two branches agree, and outside it the term goes flat so there is no gradient left to follow">
  <style>
    .fig-card  { fill: var(--quote-bg, #13293d); stroke: var(--quote-border, #274357); stroke-width: 1; }
    .fig-alt   { fill: var(--table-alternate-bg, #0f2438); stroke: var(--quote-border, #274357); stroke-width: 1; }
    .fig-t     { fill: var(--fg, #dce6f0); font-size: 13px; font-weight: 600; }
    .fig-s     { fill: var(--sidebar-fg, #8fa6bd); font-size: 11.5px; }
    .fig-cap   { fill: var(--sidebar-fg, #8fa6bd); font-size: 11.5px; letter-spacing: .10em; }
    .fig-axis  { stroke: var(--quote-border, #274357); stroke-width: 1; fill: none; }
    .fig-dash  { stroke: var(--quote-border, #274357); stroke-width: 1.25; stroke-dasharray: 4 4; fill: none; }
    .fig-a-posln { stroke: #3f8f6f; stroke-width: 2; fill: none; }
    .fig-a-negln { stroke: #b06a5e; stroke-width: 2; fill: none; }
    .fig-a-posf  { fill: #3f8f6f; }
    .fig-a-negf  { fill: #b06a5e; }
  </style>
  <text class="fig-cap" x="40" y="20">ONE ACTION, ONE BATCH - WHAT THE CLIP DOES TO THE GRADIENT</text>
  <rect class="fig-alt" x="273" y="62" width="244" height="188" opacity="0.45"/>
  <path class="fig-dash" d="M273 62 V 250"/>
  <path class="fig-dash" d="M517 62 V 250"/>
  <path class="fig-axis" d="M80 160 H 710"/>
  <path class="fig-axis" d="M90 62 V 250"/>
  <text class="fig-s" x="273" y="56" text-anchor="middle">1 - e</text>
  <text class="fig-s" x="517" y="56" text-anchor="middle">1 + e</text>
  <text class="fig-s" x="395" y="240" text-anchor="middle">the clip band</text>
  <polyline class="fig-a-posln" points="90,130 395,100 517,88 700,88"/>
  <polyline class="fig-a-negln" points="90,208 273,208 700,250"/>
  <text class="fig-t fig-a-posf" x="424" y="74">A &gt; 0</text>
  <text class="fig-t fig-a-negf" x="300" y="200">A &lt; 0</text>
  <text class="fig-s" x="700" y="78" text-anchor="end">no gain from making it likelier</text>
  <text class="fig-s" x="96" y="188">no gain from making it rarer</text>
  <text class="fig-s" x="40" y="170" text-anchor="start">0</text>
  <text class="fig-s" x="700" y="272" text-anchor="middle">1.5</text>
  <text class="fig-s" x="517" y="272" text-anchor="middle">1.2</text>
  <text class="fig-s" x="395" y="272" text-anchor="middle">1.0</text>
  <text class="fig-s" x="273" y="272" text-anchor="middle">0.8</text>
  <text class="fig-s" x="90" y="272" text-anchor="middle">0.5</text>
  <text class="fig-s" x="395" y="294" text-anchor="middle">probability ratio r = new policy / sampling policy</text>
  <text class="fig-s" x="40" y="314">Inside the band the two branches of the min agree; outside it the clipped branch is the smaller one, and a flat line has no gradient.</text>
</svg>
