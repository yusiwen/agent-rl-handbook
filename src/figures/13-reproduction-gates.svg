<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 462" role="img" aria-label="Four gates between a paper claim and an adoption decision, each gate with the verdict that ends the review if it fails.">
<style>
  .t { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  .box { fill: var(--quote-bg, #eef2f6); stroke: var(--quote-border, #c3ccd6); stroke-width: 1; }
  .box-ok { fill: var(--quote-bg, #eef2f6); stroke: #3f8f6f; stroke-width: 1.5; }
  .label { font-size: 12px; fill: var(--fg, var(--foreground, #24313d)); }
  .small { font-size: 10.5px; fill: var(--muted-foreground, #8a949e); }
  .title { font-size: 13px; font-weight: 600; fill: var(--fg, var(--foreground, #24313d)); }
  .note { font-size: 11px; fill: var(--muted-foreground, #8a949e); }
  .edge { stroke: var(--fg, var(--foreground, #24313d)); stroke-width: 1; opacity: .5; }
  .fig-a-stop { fill: #b06a5e; }
  .fig-a-park { fill: #b8703f; }
</style>
<text class="t title" x="16" y="24">From a paper claim to a verdict, in four gates</text>
<text class="t note" x="16" y="42">a failed gate ends the review, and the verdict names the gate that stopped it</text>
<rect class="box" x="40" y="64" width="300" height="42" rx="4"/>
<text class="t label" x="52" y="82">the paper's claim</text>
<text class="t small" x="52" y="97">four days, not a reproduction</text>
<line class="edge" x1="190.0" y1="106" x2="190.0" y2="132"/>
<path d="M186.0,127 L190.0,132 L194.0,127" fill="none" class="edge"/>
<rect class="box" x="40" y="132" width="300" height="42" rx="4"/>
<text class="t label" x="52" y="150">gate 1 · the artifact runs</text>
<text class="t small" x="52" y="165">one sample through the code path</text>
<line class="edge" x1="190.0" y1="174" x2="190.0" y2="200"/>
<path d="M186.0,195 L190.0,200 L194.0,195" fill="none" class="edge"/>
<line class="edge" x1="340" y1="153.0" x2="372" y2="153.0"/>
<circle cx="380" cy="153.0" r="5" class="fig-a-stop"/>
<text class="t label" x="392" y="157.0">unrunnable: stop</text>
<rect class="box" x="40" y="200" width="300" height="42" rx="4"/>
<text class="t label" x="52" y="218">gate 2 · the floor reproduces</text>
<text class="t small" x="52" y="233">their baseline, on your data</text>
<line class="edge" x1="190.0" y1="242" x2="190.0" y2="268"/>
<path d="M186.0,263 L190.0,268 L194.0,263" fill="none" class="edge"/>
<line class="edge" x1="340" y1="221.0" x2="372" y2="221.0"/>
<circle cx="380" cy="221.0" r="5" class="fig-a-stop"/>
<text class="t label" x="392" y="225.0">out of regime: stop</text>
<rect class="box" x="40" y="268" width="300" height="42" rx="4"/>
<text class="t label" x="52" y="286">gate 3 · the interval clears</text>
<text class="t small" x="52" y="301">with and without, n of one hundred</text>
<line class="edge" x1="190.0" y1="310" x2="190.0" y2="336"/>
<path d="M186.0,331 L190.0,336 L194.0,331" fill="none" class="edge"/>
<line class="edge" x1="340" y1="289.0" x2="372" y2="289.0"/>
<circle cx="380" cy="289.0" r="5" class="fig-a-park"/>
<text class="t label" x="392" y="293.0">promising, unmeasured: park</text>
<rect class="box" x="40" y="336" width="300" height="42" rx="4"/>
<text class="t label" x="52" y="354">gate 4 · the ablation isolates</text>
<text class="t small" x="52" y="369">remove only the named change</text>
<line class="edge" x1="190.0" y1="378" x2="190.0" y2="404"/>
<path d="M186.0,399 L190.0,404 L194.0,399" fill="none" class="edge"/>
<line class="edge" x1="340" y1="357.0" x2="372" y2="357.0"/>
<circle cx="380" cy="357.0" r="5" class="fig-a-park"/>
<text class="t label" x="392" y="361.0">reduce to the component</text>
<rect class="box-ok" x="40" y="404" width="300" height="42" rx="4"/>
<text class="t label" x="52" y="422">adopt</text>
<text class="t small" x="52" y="437">one line, and the question that decided it</text>
<text class="t note" x="16" y="472">the cheap gates come first on purpose: most papers die at gate one, and that is a result.</text>
</svg>
