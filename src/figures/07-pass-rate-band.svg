<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 320" width="100%" style="max-width:100%;height:auto"
     role="img" aria-label="A histogram of 22 measured tasks by how many of 8 attempts each model got right, at two temperatures: ten tasks sit at zero solved and five at eight solved, with a thin middle, and the two temperatures disagree about the middle">
  <style>
    .fig-card  { fill: var(--quote-bg, #13293d); stroke: var(--quote-border, #274357); stroke-width: 1; }
