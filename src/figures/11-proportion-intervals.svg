<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 372" width="100%" style="max-width:100%;height:auto"
     role="img" aria-label="Wilson 95 percent intervals for ten evaluation results: the calibrated band at three temperatures, the band after one update, the two five-step plan families at two temperatures, and the demonstrations and credit runs, all between zero and one hundred percent">
  <style>
    .fig-band  { fill: var(--table-alternate-bg, #0f2438); stroke: var(--quote-border, #274357); stroke-width: 1; }
    .fig-t     { fill: var(--fg, #dce6f0); font-size: 12.5px; font-weight: 600; }
    .fig-s     { fill: var(--sidebar-fg, #8fa6bd); font-size: 11.5px; }
    .fig-n     { fill: var(--sidebar-fg, #8fa6bd); font-size: 10.5px; }
    .fig-cap   { fill: var(--sidebar-fg, #8fa6bd); font-size: 11.5px; letter-spacing: .10em; }
    .fig-axis  { stroke: var(--quote-border, #274357); stroke-width: 1; fill: none; }
    .fig-grid  { stroke: var(--quote-border, #274357); stroke-width: 1; stroke-dasharray: 2 4; opacity: .55; }
    .fig-interval { stroke: var(--sidebar-fg, #8fa6bd); stroke-width: 2; opacity: .85; }
    .fig-a-cheap { fill: #3f8f6f; }
    .fig-a-mid   { fill: #4d86b8; }
    .fig-a-dear  { fill: #b8703f; }
  </style>
  <text class="fig-cap" x="24" y="24">WHAT SIXTY ROLLOUTS CAN AND CANNOT SAY - WILSON 95% INTERVALS</text>
  <rect class="fig-band" x="236" y="38" width="510" height="284" rx="6"/>
  <line class="fig-grid" x1="250" y1="38" x2="250" y2="322"/>
  <text class="fig-n" x="250" y="342" text-anchor="middle">0%</text>
  <line class="fig-grid" x1="370" y1="38" x2="370" y2="322"/>
  <text class="fig-n" x="370" y="342" text-anchor="middle">25%</text>
  <line class="fig-grid" x1="490" y1="38" x2="490" y2="322"/>
  <text class="fig-n" x="490" y="342" text-anchor="middle">50%</text>
  <line class="fig-grid" x1="610" y1="38" x2="610" y2="322"/>
  <text class="fig-n" x="610" y="342" text-anchor="middle">75%</text>
  <line class="fig-grid" x1="730" y1="38" x2="730" y2="322"/>
  <text class="fig-n" x="730" y="342" text-anchor="middle">100%</text>
  <text class="fig-s" x="228" y="70" text-anchor="end">band, T=1.0, lr=0</text>
  <line class="fig-interval" x1="250.0" y1="66" x2="278.9" y2="66"/>
  <circle class="fig-a-bad" cx="250.0" cy="66" r="4.5"/>
  <text class="fig-n" x="289" y="70">0/60</text>
  <text class="fig-s" x="228" y="97" text-anchor="end">band, T=1.3, lr=0</text>
  <line class="fig-interval" x1="250.0" y1="93" x2="278.9" y2="93"/>
  <circle class="fig-a-bad" cx="250.0" cy="93" r="4.5"/>
  <text class="fig-n" x="289" y="97">0/60</text>
  <text class="fig-s" x="228" y="124" text-anchor="end">band, T=1.7, lr=0</text>
  <line class="fig-interval" x1="258.2" y1="120" x2="315.8" y2="120"/>
  <circle class="fig-a-bad" cx="274.0" cy="120" r="4.5"/>
  <text class="fig-n" x="326" y="124">3/60</text>
  <text class="fig-s" x="228" y="151" text-anchor="end">band, after 1 update</text>
  <line class="fig-interval" x1="701.1" y1="147" x2="730.0" y2="147"/>
  <circle class="fig-a-ok" cx="730.0" cy="147" r="4.5"/>
  <text class="fig-n" x="691" y="151" text-anchor="end">60/60</text>
  <text class="fig-s" x="228" y="178" text-anchor="end">files plans, T=0</text>
  <line class="fig-interval" x1="675.5" y1="174" x2="730.0" y2="174"/>
  <circle class="fig-a-ok" cx="730.0" cy="174" r="4.5"/>
  <text class="fig-n" x="666" y="178" text-anchor="end">30/30</text>
  <text class="fig-s" x="228" y="205" text-anchor="end">files plans, T=1.7</text>
  <line class="fig-interval" x1="423.5" y1="201" x2="584.9" y2="201"/>
  <circle class="fig-a-mid" cx="506.0" cy="201" r="4.5"/>
  <text class="fig-n" x="595" y="205">16/30</text>
  <text class="fig-s" x="228" y="232" text-anchor="end">ledger plans, both T</text>
  <line class="fig-interval" x1="250.0" y1="228" x2="278.9" y2="228"/>
  <circle class="fig-a-bad" cx="250.0" cy="228" r="4.5"/>
  <text class="fig-n" x="289" y="232">0/60</text>
  <text class="fig-s" x="228" y="259" text-anchor="end">demos, 2 epochs</text>
  <line class="fig-interval" x1="509.5" y1="255" x2="620.9" y2="255"/>
  <circle class="fig-a-mid" cx="570.0" cy="255" r="4.5"/>
  <text class="fig-n" x="631" y="259">40/60</text>
  <text class="fig-s" x="228" y="286" text-anchor="end">demos, 8 epochs</text>
  <line class="fig-interval" x1="595.4" y1="282" x2="685.3" y2="282"/>
  <circle class="fig-a-mid" cx="650.0" cy="282" r="4.5"/>
  <text class="fig-n" x="585" y="286" text-anchor="end">50/60</text>
  <text class="fig-s" x="228" y="313" text-anchor="end">three-tier, greedy</text>
  <line class="fig-interval" x1="484.1" y1="309" x2="637.7" y2="309"/>
  <circle class="fig-a-mid" cx="570.0" cy="309" r="4.5"/>
  <text class="fig-n" x="474" y="313" text-anchor="end">20/30</text>
</svg>
