<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 392" role="img" aria-label="A triage tree from the shape of a failure to one of four optional modules, with the first artefact to build in each case and a skip branch.">
<style>
  .t { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  .label { font-size: 12px; fill: var(--fg, var(--foreground, #24313d)); }
  .small { font-size: 10.5px; fill: var(--muted-foreground, #8a949e); }
  .title { font-size: 13px; font-weight: 600; fill: var(--fg, var(--foreground, #24313d)); }
  .note { font-size: 11px; fill: var(--muted-foreground, #8a949e); }
  .box { fill: var(--quote-bg, #eef2f6); stroke: var(--quote-border, #c3ccd6); stroke-width: 1; }
  .qbox { fill: var(--quote-bg, #eef2f6); stroke: #4d86b8; stroke-width: 1.5; }
  .skip { fill: var(--quote-bg, #eef2f6); stroke: var(--quote-border, #c3ccd6); stroke-width: 1; stroke-dasharray: 3 3; }
  .edge { stroke: var(--fg, var(--foreground, #24313d)); stroke-width: 1; opacity: .45; fill: none; }
  .fig-a-build { fill: #3f8f6f; }
  .fig-a-skip { fill: #7f8c99; }
</style>
<text class="t title" x="16" y="24">Which of the four modules is yours</text>
<text class="t note" x="16" y="42">start from the shape of the failure, not from the module you have heard of</text>
<rect class="qbox" x="196" y="60" width="408" height="40" rx="4"/>
<text class="t label" x="400.0" y="85" text-anchor="middle">what does the failure look like?</text>
<path class="edge" d="M400.0,100 C400.0,120 103.0,120 103.0,150"/>
<rect class="box" x="14" y="150" width="178" height="104" rx="4"/>
<text class="t label" x="103.0" y="172" text-anchor="middle">Environment-side safety</text>
<text class="t small" x="103.0" y="192" text-anchor="middle">the tool allowed it,</text>
<text class="t small" x="103.0" y="207" text-anchor="middle">not the reward</text>
<circle class="fig-a-build" cx="45.0" cy="238" r="3.5"/>
<text class="t small" x="55.0" y="242">audit the harness</text>
<path class="edge" d="M400.0,100 C400.0,120 295.0,120 295.0,150"/>
<rect class="box" x="206" y="150" width="178" height="104" rx="4"/>
<text class="t label" x="295.0" y="172" text-anchor="middle">Multi-agent RL</text>
<text class="t small" x="295.0" y="192" text-anchor="middle">several roles, no one</text>
<text class="t small" x="295.0" y="207" text-anchor="middle">owns the miss</text>
<circle class="fig-a-build" cx="237.0" cy="238" r="3.5"/>
<text class="t small" x="247.0" y="242">per-role ablation</text>
<path class="edge" d="M400.0,100 C400.0,120 487.0,120 487.0,150"/>
<rect class="box" x="398" y="150" width="178" height="104" rx="4"/>
<text class="t label" x="487.0" y="172" text-anchor="middle">Domain agents</text>
<text class="t small" x="487.0" y="192" text-anchor="middle">a test suite or a</text>
<text class="t small" x="487.0" y="207" text-anchor="middle">screen state decides</text>
<circle class="fig-a-build" cx="429.0" cy="238" r="3.5"/>
<text class="t small" x="439.0" y="242">version the verifier</text>
<path class="edge" d="M400.0,100 C400.0,120 679.0,120 679.0,150"/>
<rect class="box" x="590" y="150" width="178" height="104" rx="4"/>
<text class="t label" x="679.0" y="172" text-anchor="middle">Context as policy</text>
<text class="t small" x="679.0" y="192" text-anchor="middle">it forgot, or drowned</text>
<text class="t small" x="679.0" y="207" text-anchor="middle">in its own context</text>
<circle class="fig-a-build" cx="621.0" cy="238" r="3.5"/>
<text class="t small" x="631.0" y="242">measure the answer rate</text>
<rect class="skip" x="196" y="284" width="408" height="38" rx="4"/>
<text class="t small" x="212" y="308">or none of these: skip all four, and come back when one names your blocker</text>
<text class="t note" x="16" y="380">the green dot is the first artefact to build, not the first paper to read.</text>
</svg>
