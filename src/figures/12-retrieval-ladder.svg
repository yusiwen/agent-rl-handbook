<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 392" role="img" aria-label="Recall at one falls when ten on-topic decoys enter the library, and does not fall further when the library grows from fifty to a hundred documents.">
<style>
  .t { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  .axis { stroke: var(--fg, var(--foreground, #24313d)); stroke-width: 1; opacity: .45; }
  .grid { stroke: var(--fg, var(--foreground, #24313d)); stroke-width: 1; stroke-dasharray: 2 4; opacity: .18; }
  .tick { font-size: 11px; fill: var(--muted-foreground, #8a949e); }
  .label { font-size: 12px; fill: var(--fg, var(--foreground, #24313d)); }
  .title { font-size: 13px; font-weight: 600; fill: var(--fg, var(--foreground, #24313d)); }
  .note { font-size: 11px; fill: var(--muted-foreground, #8a949e); }
  .fig-a-kw { fill: #b8703f; }
  .fig-a-ve { fill: #7f8c99; }
  .fig-a-hy { fill: #a97a3c; }
  .fig-a-idf { fill: #4d86b8; }
  .fig-a-kw-l { stroke: #b8703f; fill: none; }
  .fig-a-ve-l { stroke: #7f8c99; fill: none; }
  .fig-a-hy-l { stroke: #a97a3c; fill: none; }
  .fig-a-idf-l { stroke: #4d86b8; fill: none; }
</style>
<text class="t title" x="16" y="26">Recall at 1 by library size, four routers</text>
<text class="t note" x="16" y="44">60 queries, six per family; ten on-topic decoys enter at the fifty-document point</text>
<circle cx="20" cy="62" r="4" class="fig-a-kw"/>
<text class="t note" x="30" y="66">keyword</text>
<circle cx="96.19999999999999" cy="62" r="4" class="fig-a-ve"/>
<text class="t note" x="106.19999999999999" y="66">vector</text>
<circle cx="165.79999999999998" cy="62" r="4" class="fig-a-hy"/>
<text class="t note" x="175.79999999999998" y="66">hybrid</text>
<circle cx="235.39999999999998" cy="62" r="4" class="fig-a-idf"/>
<text class="t note" x="245.39999999999998" y="66">idf</text>
<line class="grid" x1="96" y1="310.0" x2="700" y2="310.0"/>
<text class="t tick" x="86" y="314.0" text-anchor="end">0.00</text>
<line class="grid" x1="96" y1="258.5" x2="700" y2="258.5"/>
<text class="t tick" x="86" y="262.5" text-anchor="end">0.25</text>
<line class="grid" x1="96" y1="207.0" x2="700" y2="207.0"/>
<text class="t tick" x="86" y="211.0" text-anchor="end">0.50</text>
<line class="grid" x1="96" y1="155.5" x2="700" y2="155.5"/>
<text class="t tick" x="86" y="159.5" text-anchor="end">0.75</text>
<line class="grid" x1="96" y1="104.0" x2="700" y2="104.0"/>
<text class="t tick" x="86" y="108.0" text-anchor="end">1.00</text>
<line class="axis" x1="96" y1="310" x2="700" y2="310"/>
<line class="axis" x1="96" y1="104" x2="96" y2="310"/>
<text class="t tick" x="96.0" y="328" text-anchor="middle">10 documents</text>
<text class="t tick" x="398.0" y="328" text-anchor="middle">50 documents</text>
<text class="t tick" x="700.0" y="328" text-anchor="middle">100 documents</text>
<line class="axis" x1="398.0" y1="90" x2="398.0" y2="310" stroke-dasharray="3 4"/>
<text class="t note" x="406.0" y="86">decoys enter here</text>
<polyline points="96.0,124.6 398.0,186.4 700.0,186.4" stroke-width="2" class="fig-a-kw-l"/>
<circle cx="96.0" cy="124.6" r="3.5" class="fig-a-kw"/>
<circle cx="398.0" cy="186.4" r="3.5" class="fig-a-kw"/>
<circle cx="700.0" cy="186.4" r="3.5" class="fig-a-kw"/>
<text class="t tick" x="710.0" y="190.4">0.60</text>
<polyline points="96.0,165.8 398.0,234.4 700.0,234.4" stroke-width="2" class="fig-a-ve-l"/>
<circle cx="96.0" cy="165.8" r="3.5" class="fig-a-ve"/>
<circle cx="398.0" cy="234.4" r="3.5" class="fig-a-ve"/>
<circle cx="700.0" cy="234.4" r="3.5" class="fig-a-ve"/>
<text class="t tick" x="710.0" y="247.0">0.37</text>
<polyline points="96.0,104.0 398.0,227.6 700.0,227.6" stroke-width="2" class="fig-a-hy-l"/>
<circle cx="96.0" cy="104.0" r="3.5" class="fig-a-hy"/>
<circle cx="398.0" cy="227.6" r="3.5" class="fig-a-hy"/>
<circle cx="700.0" cy="227.6" r="3.5" class="fig-a-hy"/>
<text class="t tick" x="710.0" y="227.0">0.40</text>
<polyline points="96.0,104.0 398.0,145.2 700.0,145.2" stroke-width="2" class="fig-a-idf-l"/>
<circle cx="96.0" cy="104.0" r="3.5" class="fig-a-idf"/>
<circle cx="398.0" cy="145.2" r="3.5" class="fig-a-idf"/>
<circle cx="700.0" cy="145.2" r="3.5" class="fig-a-idf"/>
<text class="t tick" x="710.0" y="149.2">0.80</text>
<text class="t note" x="16" y="376">fifty and a hundred documents score identically: the cost is similarity, not count.</text>
</svg>
