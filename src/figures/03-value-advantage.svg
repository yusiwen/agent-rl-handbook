<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 320" width="100%" style="max-width:100%;height:auto"
     role="img" aria-label="Three moves from one situation: the bars are measured from the value of the situation, so what remains is the advantage">
  <style>
    .fig-card  { fill: var(--quote-bg, #13293d); stroke: var(--quote-border, #274357); stroke-width: 1; }
    .fig-t     { fill: var(--fg, #dce6f0); font-size: 13px; font-weight: 600; }
    .fig-s     { fill: var(--sidebar-fg, #8fa6bd); font-size: 11.5px; }
    .fig-cap   { fill: var(--sidebar-fg, #8fa6bd); font-size: 11.5px; letter-spacing: .10em; }
    .fig-axis  { stroke: var(--quote-border, #274357); stroke-width: 1; fill: none; }
    .fig-dash  { stroke: var(--quote-border, #274357); stroke-width: 1.25; stroke-dasharray: 4 4; fill: none; }
    .fig-a-pos { fill: #3f8f6f; }
    .fig-a-neg { fill: #b06a5e; }
  </style>
  <text class="fig-cap" x="40" y="20">ONE SITUATION, THREE MOVES — WHAT SUBTRACTING THE BASELINE LEAVES</text>
  <text class="fig-s" x="410" y="46" text-anchor="middle">V(s) = 0.35 — the situation's own value</text>
  <path class="fig-dash" d="M410 52 V 232"/>
  <path class="fig-axis" d="M200 52 V 232"/>
  <text class="fig-t" x="48" y="89">a1</text>
  <text class="fig-t" x="48" y="149">a2</text>
  <text class="fig-t" x="48" y="209">a3</text>
  <text class="fig-s" x="320" y="64">A = -0.15</text>
  <text class="fig-s" x="410" y="124">A = +0.05</text>
  <text class="fig-s" x="410" y="184">A = +0.35</text>
  <rect class="fig-a-neg" x="320" y="72" width="90" height="30" rx="6"/>
  <rect class="fig-a-pos" x="410" y="132" width="30" height="30" rx="6"/>
  <rect class="fig-a-pos" x="410" y="192" width="210" height="30" rx="6"/>
  <text class="fig-s" x="312" y="92" text-anchor="end">Q = 0.20</text>
  <text class="fig-s" x="448" y="152">Q = 0.40</text>
  <text class="fig-s" x="628" y="212">Q = 0.70</text>
  <path class="fig-axis" d="M200 232 H 620"/>
  <path class="fig-axis" d="M200 232 V 238 M410 232 V 238 M620 232 V 238"/>
  <text class="fig-s" x="200" y="254" text-anchor="middle">0</text>
  <text class="fig-s" x="410" y="254" text-anchor="middle">0.35</text>
  <text class="fig-s" x="620" y="254" text-anchor="middle">0.70</text>
  <text class="fig-s" x="40" y="286">The bars are measured from V(s), not from zero — the situation's own difficulty cancels out.</text>
  <text class="fig-s" x="40" y="308">What is left is this move compared with the policy's usual behaviour here, and that is the weight the gradient gets.</text>
</svg>
